name: Verificacion de JJK New World
on:
  push:
    branches: [main]
  pull_request:
jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revisar codigo y catalogo
        run: node scripts/check-site.mjs
